[platformio]
default_envs = esp32-c6-supermini

[env:esp32-c6-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git#v3.0.2
  adafruit/Adafruit NeoPixel @ ^1.12.5

; PC host mode: text logs OFF, only protocol bytes on USB serial, DTR/RTS auto-reset disabled.
; Upload this one with: BOOT + RST (download mode), then  pio run -e rfkey_host -t upload
[env:rfkey_host]
extends = env:esp32-c6-supermini
build_flags =
  ${env:esp32-c6-supermini.build_flags}
  -DHOST_PROTOCOL=1

; CC1101 wiring test (no library): pio run -e diag -t upload
[env:diag]
extends = env:esp32-c6-supermini
build_src_filter = -<*> +<../diag/diag.cpp>
lib_deps =