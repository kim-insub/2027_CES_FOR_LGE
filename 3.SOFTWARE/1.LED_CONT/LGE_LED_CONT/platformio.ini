; ============================================================================
;  DC27_FRT  -  LED 통합 펌웨어 (ESP32-C6 SuperMini, PlatformIO / pioarduino)
;  DEVICE_ID 0x10~0x13 별로 이펙트/LED 수가 달라진다 -> src/config.h 의 표 참고
;
;  업로드는 항상 환경을 지정:   pio run -e dc27_frt_10 -t upload --upload-port COMxx
;  (환경을 지정하지 않으면 default_envs 하나만 올라간다)
;
;  호스트 모드 펌웨어: 시리얼에 ID 외 아무것도 출력하지 않고, DTR/RTS 자동 리셋이 꺼져 있다
;  (include/usb_noreset.h) -> 업로드는 BOOT+RST, 또는 PC 에서 0xF0 0xA5 0x5A 전송.
;
;  Pins : include/board_pins.h   (LED 데이터 = GPIO6)
; ============================================================================

; 환경이 여러 개이므로 default_envs 를 반드시 하나로 고정한다.
; config.h 의 기본 DEVICE_ID(0x10)와 같은 환경으로 둘 것.
[platformio]
default_envs = dc27_frt_11
[base]
; ESP32-C6 needs the pioarduino fork (official espressif32 does not support it)
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Iinclude
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    ; Host link (PC <-> board, 115200 8N1) = native USB (USB-Serial/JTAG on GPIO12/13)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1

; DEVICE_ID 0x10 : FX_TYPE 0x01 (180 LEDs)
[env:dc27_frt_10]
extends = base
build_flags =
    ${base.build_flags}
    -DDEVICE_ID=0x10

; DEVICE_ID 0x11 : FX_TYPE 0x02 (180 LEDs)
[env:dc27_frt_11]
extends = base
build_flags =
    ${base.build_flags}
    -DDEVICE_ID=0x11

; DEVICE_ID 0x12 : FX_TYPE 0x03 (150 LEDs)
[env:dc27_frt_12]
extends = base
build_flags =
    ${base.build_flags}
    -DDEVICE_ID=0x12

; DEVICE_ID 0x13 : FX_TYPE 0x04 (8 LEDs)
[env:dc27_frt_13]
extends = base
build_flags =
    ${base.build_flags}
    -DDEVICE_ID=0x13
